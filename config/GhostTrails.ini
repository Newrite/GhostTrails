[GhostTrails]
; Detailed capture/timing traces require xmake f --diagnostics=y.
; Normal warnings, failed attempts and final outcomes are always logged.
VerboseLog=0

; Admission and retained status records share this bound. Call Release(id).
MaxRequests=256
; Only actors actually requested by an API consumer are tracked.
MaxActors=16
SlotsPerActor=16
TotalSlots=64
; Global retained GPU budget for neutral cutout masks (all requested actors).
; A source texture is converted once per actor pool, not once per ghost.
MaxCoverageMiB=512
; A single native clone cannot be interrupted; warm up with Prepare first.
ClonesPerFrame=1
; Unused pools release all engine resources after this many real seconds.
IdleSeconds=10
